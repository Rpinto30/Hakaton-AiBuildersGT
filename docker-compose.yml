# Postgres 17 + PostGIS 3.5 para el proyecto Educación Formal 2024.
# Las credenciales vienen de .env (copia env.example); .env no se versiona.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: educacion-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educacion}
      POSTGRES_USER: ${POSTGRES_USER:-educacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      # Solo accesible desde tu máquina, no desde la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de tablas/ NO se montan en /docker-entrypoint-initdb.d a
      # propósito: la carga usa \copy, que lee el CSV desde el cliente y no
      # desde el contenedor. El orden completo está en el README.
    shm_size: 256mb
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicialización el servidor temporal
      # solo escucha por socket unix, y sin -h el healthcheck daría "healthy" antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
